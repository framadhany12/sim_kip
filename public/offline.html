<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2a63" />
    <title>Tidak ada koneksi · SIM KIP Politeknik TEDC</title>
    <style>
      :root {
        --latar: #f8fafc;
        --kartu: #ffffff;
        --teks: #0f172a;
        --redup: #475569;
        --garis: #e2e8f0;
        --utama: #0d2a63;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --latar: #0b1220;
          --kartu: #111a2e;
          --teks: #e2e8f0;
          --redup: #a3b1c6;
          --garis: #24324d;
          --utama: #2f5fc4;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--latar);
        color: var(--teks);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--kartu);
        border: 1px solid var(--garis);
        border-radius: 14px;
        padding: 28px 24px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: var(--redup);
      }
      button {
        margin-top: 22px;
        min-height: 44px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        background: var(--utama);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #f5c400;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-tedc.png" alt="Logo Politeknik TEDC Bandung" />
      <h1>Tidak ada koneksi internet</h1>
      <p>SIM KIP butuh internet untuk memuat data akun. Periksa sinyal atau Wi-Fi, lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
